        <rect x="13" y="13" width="7" height="7" rx="1.2" />
        <line x1="7" y1="3.5" x2="8" y2="8" />
        <line x1="12" y1="12" x2="13" y2="16.5" />
      </g>
      <text x="38" y="20" class="label">Agentic Workflows</text>
    </g>

    <g id="card-agentic-workflows-icon" transform="translate(48 98)" class="stroke">
