<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" fill="none" role="img" aria-labelledby="aiSolutionsTitle">
  <title id="aiSolutionsTitle">eForte AI Solutions — LLM Apps, Chat Bots, Automations, Agentic Workflows</title>
  <desc>Four outlined solution cards with icons and descriptions</desc>

  <!-- Accent: lighter shade of #0F1551 for dark backgrounds -->
  <defs>
    <rect id="card-frame" x="0" y="0" width="250" height="440" rx="18" ry="18" />
    <style type="text/css"><![CDATA[
      .stroke {
        stroke: #5C6BCF;
        stroke-width: 2.25;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .stroke-sm {
        stroke: #5C6BCF;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .fill-accent { fill: #5C6BCF; stroke: none; }
      .title {
        fill: #FFFFFF;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        font-size: 20px;
        font-weight: 700;
      }
      .label {
        fill: #FFFFFF;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
      }
      .desc {
        fill: #FFFFFF;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        font-size: 12px;
        font-weight: 400;
      }
    ]]></style>
  </defs>

  <!-- ===================== CARD 1: LLM Apps ===================== -->
  <g id="card-llm-apps" transform="translate(35 20)">
    <g id="card-llm-apps-frame">
      <use href="#card-frame" class="stroke" />
    </g>

    <g id="card-llm-apps-header" transform="translate(22 26)">
      <rect x="0" y="0" width="30" height="30" rx="7" class="stroke-sm" />
      <g id="card-llm-apps-header-icon" transform="translate(6 5)" class="stroke-sm">
        <rect x="1" y="1" width="12" height="15" rx="1.5" />
        <line x1="4" y1="5" x2="10" y2="5" />
        <line x1="4" y1="8" x2="10" y2="8" />
        <line x1="4" y1="11" x2="8" y2="11" />
        <circle cx="14" cy="15" r="4.5" />
        <line x1="17.2" y1="18.2" x2="20.5" y2="21.5" />
      </g>
      <text x="40" y="20" class="label">LLM Apps</text>
    </g>

    <g id="card-llm-apps-icon" transform="translate(52 100)" class="stroke">
      <rect x="16" y="20" width="72" height="92" rx="5" />
      <rect x="24" y="12" width="72" height="92" rx="5" />
      <rect x="32" y="4" width="72" height="92" rx="5" />
      <line x1="46" y1="28" x2="90" y2="28" />
      <line x1="46" y1="42" x2="90" y2="42" />
      <line x1="46" y1="56" x2="82" y2="56" />
      <line x1="46" y1="70" x2="90" y2="70" />
      <circle cx="96" cy="82" r="24" />
      <line x1="113" y1="99" x2="132" y2="118" stroke-width="3" />
    </g>

    <g id="card-llm-apps-text" transform="translate(125 325)">
      <text text-anchor="middle" class="title">LLM Apps</text>
      <text text-anchor="middle" y="28" class="desc">Tailored large language model solutions</text>
      <text text-anchor="middle" y="46" class="desc">for custom business applications.</text>
    </g>
  </g>

  <!-- ===================== CARD 2: Chat Bots ===================== -->
  <g id="card-chat-bots" transform="translate(328 20)">
    <g id="card-chat-bots-frame">
      <use href="#card-frame" class="stroke" />
    </g>

    <g id="card-chat-bots-header" transform="translate(22 26)">
      <rect x="0" y="0" width="30" height="30" rx="7" class="stroke-sm" />
      <g id="card-chat-bots-header-icon" transform="translate(5 6)" class="stroke-sm">
        <rect x="0" y="5" width="13" height="11" rx="2.5" />
        <rect x="7" y="0" width="13" height="11" rx="2.5" />
      </g>
      <text x="40" y="20" class="label">Chat Bots</text>
    </g>

    <g id="card-chat-bots-icon" transform="translate(45 105)" class="stroke">
      <rect x="6" y="36" width="100" height="72" rx="14" />
      <path d="M 30 108 L 30 128 L 52 108" />
      <rect x="42" y="10" width="100" height="72" rx="14" />
      <path d="M 118 82 L 118 102 L 96 82" />
      <line x1="60" y1="34" x2="120" y2="34" />
      <line x1="60" y1="48" x2="120" y2="48" />
      <line x1="60" y1="62" x2="108" y2="62" />
      <g id="card-chat-bots-headset" transform="translate(72 22)" class="stroke">
        <path d="M 14 30 C 14 12 50 12 50 30" />
        <rect x="6" y="28" width="14" height="22" rx="5" />
        <rect x="44" y="28" width="14" height="22" rx="5" />
        <path d="M 58 38 C 72 38 74 52 64 56" />
        <circle cx="64" cy="58" r="4.5" class="fill-accent" />
      </g>
    </g>

    <g id="card-chat-bots-text" transform="translate(125 325)">
      <text text-anchor="middle" class="title">Chat Bots</text>
      <text text-anchor="middle" y="28" class="desc">Intelligent conversational agents for</text>
      <text text-anchor="middle" y="46" class="desc">customer support and engagement.</text>
    </g>
  </g>

  <!-- ===================== CARD 3: Automations ===================== -->
  <g id="card-automations" transform="translate(621 20)">
    <g id="card-automations-frame">
