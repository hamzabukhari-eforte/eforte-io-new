      <g id="gear-large" transform="translate(58 52)">
        <circle r="20" />
        <circle r="9" />
        <line x1="0" y1="-30" x2="0" y2="-22" />
        <line x1="0" y1="22" x2="0" y2="30" />
        <line x1="-30" y1="0" x2="-22" y2="0" />
        <line x1="22" y1="0" x2="30" y2="0" />
        <line x1="-21" y1="-21" x2="-15" y2="-15" />
        <line x1="15" y1="15" x2="21" y2="21" />
        <line x1="21" y1="-21" x2="15" y2="-15" />
        <line x1="-15" y1="15" x2="-21" y2="21" />
      </g>
      <g id="gear-medium" transform="translate(108 38)">
        <circle r="15" />
        <circle r="6.5" />
        <line x1="0" y1="-23" x2="0" y2="-17" />
        <line x1="0" y1="17" x2="0" y2="23" />
        <line x1="-23" y1="0" x2="-17" y2="0" />
        <line x1="17" y1="0" x2="23" y2="0" />
      </g>
      <g id="gear-small" transform="translate(100 88)">
        <circle r="11" />
        <circle r="4.5" />
        <line x1="0" y1="-17" x2="0" y2="-13" />
        <line x1="0" y1="13" x2="0" y2="17" />
        <line x1="-17" y1="0" x2="-13" y2="0" />
        <line x1="13" y1="0" x2="17" y2="0" />
