        <circle cx="-5.5" cy="-2.5" r="1.8" class="fill-accent" />
        <circle cx="5.5" cy="-2.5" r="1.8" class="fill-accent" />
        <line x1="-5" y1="5" x2="5" y2="5" class="stroke-sm" />
        <line x1="-4" y1="-14" x2="-4" y2="-9" class="stroke-sm" />
        <line x1="4" y1="-14" x2="4" y2="-9" class="stroke-sm" />
