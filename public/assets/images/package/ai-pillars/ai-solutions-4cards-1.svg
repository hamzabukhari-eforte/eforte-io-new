        <path d="M 14 11 L 28 18 L 14 25 Z" class="fill-accent" />
        <line x1="42" y1="18" x2="72" y2="18" class="stroke" />
        <polyline points="66,12 74,18 66,24" class="stroke" />
        <ellipse cx="98" cy="10" rx="17" ry="6.5" class="stroke" />
        <path d="M 81 10 V 28 C 81 35 115 35 115 28 V 10" class="stroke" />
        <ellipse cx="98" cy="28" rx="17" ry="6.5" class="stroke" />
        <line x1="124" y1="18" x2="154" y2="18" class="stroke" />
        <polyline points="148,12 156,18 148,24" class="stroke" />
        <rect x="162" y="4" width="34" height="28" rx="4" class="stroke" />
        <line x1="169" y1="12" x2="188" y2="12" class="stroke" />
        <line x1="169" y1="18" x2="188" y2="18" class="stroke" />
        <line x1="169" y1="24" x2="182" y2="24" class="stroke" />
      </g>
    </g>

    <g id="card-automations-text" transform="translate(125 325)">
      <text text-anchor="middle" class="title">Automations</text>
      <text text-anchor="middle" y="28" class="desc">Streamline repetitive tasks, data</text>
      <text text-anchor="middle" y="46" class="desc">processing, and operations.</text>
    </g>
  </g>

  <!-- ===================== CARD 4: Agentic Workflows ===================== -->
