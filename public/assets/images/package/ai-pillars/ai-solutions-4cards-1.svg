      <g id="workflow-nodes" class="stroke-sm">
        <path d="M 77 6 L 91 20 L 77 34 L 63 20 Z" />
        <rect x="6" y="16" width="30" height="20" rx="3" />
        <rect x="118" y="16" width="30" height="20" rx="3" />
        <path d="M 16 72 L 30 86 L 16 100 L 2 86 Z" />
        <path d="M 138 72 L 152 86 L 138 100 L 124 86 Z" />
        <rect x="6" y="122" width="30" height="20" rx="3" />
        <rect x="118" y="122" width="30" height="20" rx="3" />
        <path d="M 77 132 L 91 146 L 77 160 L 63 146 Z" />
      </g>

      <g id="workflow-connectors" class="stroke-sm">
        <line x1="77" y1="34" x2="77" y2="42" />
        <line x1="77" y1="102" x2="77" y2="132" />
        <line x1="30" y1="86" x2="47" y2="86" />
        <line x1="107" y1="86" x2="124" y2="86" />
        <line x1="36" y1="36" x2="56" y2="56" />
        <line x1="118" y1="36" x2="98" y2="56" />
        <line x1="36" y1="122" x2="56" y2="98" />
        <line x1="118" y1="122" x2="98" y2="98" />
        <polyline points="72,40 77,47 82,40" />
        <polyline points="72,128 77,135 82,128" />
