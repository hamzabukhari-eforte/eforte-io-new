sonar.projectKey=eforte-new
sonar.projectName=eForte New
sonar.projectVersion=0.1.0

# App sources (strapi excluded for now)
sonar.sources=apps/web,apps/api
sonar.sourceEncoding=UTF-8

sonar.exclusions=\
**/node_modules/**,\
**/.next/**,\
**/dist/**,\
**/build/**,\
**/.cache/**,\
**/coverage/**,\
**/uploads/**,\
**/*.min.js,\
**/pnpm-lock.yaml,\
**/package-lock.json,\
**/*.map,\
apps/web/scripts/**,\
**/docs/**

# Intentional design: active nav link uses underline, not alternate text color
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S3923
sonar.issue.ignore.multicriteria.e1.resourceKey=**/Navbar.tsx

# Keep secrets / security sensors on source + config files
sonar.text.activate=true

sonar.host.url=http://localhost:9000
